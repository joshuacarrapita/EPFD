[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epfd"
version = "0.1.0"
description = "Ensemble Pruning based on Objection Maximization with a General Distributed Framework"
readme = "README.md"
requires-python = ">=3.11" 

# --- Abhängigkeiten ---
dependencies = [
    "numpy==1.16.2",
    "scipy==1.3.2",
    "scikit-learn==0.21.3",
    "Pillow",
    "pathos==0.2.5",
    "pympler==0.8",
    "pytest"
]

# --- Paket-Discovery ---
[tool.setuptools.packages.find]
where = ["."]  # Sucht im Stammverzeichnis (neben dieser .toml)
include = [
    "epfd*",    
    "scripts*" 
]
exclude = [
    "tests*"  
]
