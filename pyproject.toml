[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epfd"
version = "0.1.0"
description = "Ensemble Pruning based on Objection Maximization with a General Distributed Framework"
readme = "README.md"
requires-python = ">=3.11" 

# --- Abhängigkeiten ---
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "Pillow",
    "pathos",
    "pympler",
    "pytest",
]

# --- Paket-Discovery ---
[tool.setuptools.packages.find]
where = ["."]  # Sucht im Stammverzeichnis (neben dieser .toml)
include = [
    "epfd*",    
    "scripts*" 
]
exclude = [
    "tests*"  
]
